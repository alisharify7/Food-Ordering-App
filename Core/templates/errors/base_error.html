{% extends "base.html" %}

{% block title %}
    Error {{ ctx.error }}
{% endblock %}

{% block content %}
    <div style="width: 100%; height: 100vh" class="d-flex flex-column justify-content-center align-items-center persian-font-bold">
        <h2 style="font-size:13rem">
            {{ ctx.error }}
        </h2>
        <p class="px-3 text-center fs-4" dir="rtl">
            {{ ctx.error_description }}
        </p>

        {% block alert %}
        {% endblock %}
        <a href="{{ url_for('web.index_view') }}" class="btn btn-primary">بازگشت به خانه</a>
    </div>
{% endblock %}

{% block scrpts %}
{% endblock %}
